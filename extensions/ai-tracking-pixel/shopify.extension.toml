name = "ai-tracking-pixel"
type = "web_pixel_extension"
uid = "28eb50da-03df-029f-c2c3-72119bac2db23fbc4f8a"

runtime_context = "strict"

[settings]
type = "object"

[settings.fields.shopDomain]
name = "Shop Domain"
description = "Store domain used when forwarding events to the app"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]

[settings.fields.apiEndpoint]
name = "API Endpoint"
description = "App proxy endpoint that receives the tracked events"
type = "single_line_text_field"
validations =  [
  { name = "min", value = "1" }
]
